# Nombre de la aplicacion
spring.application.name=OMS

# Configuracion de Hibernate para actualizar automaticamente el esquema de la base de datos
spring.jpa.hibernate.ddl-auto=update

# URL de conexion a la base de datos.
# Preferimos la variable estándar SPRING_DATASOURCE_URL en formato JDBC (ej: jdbc:postgresql://host:5432/dbname)
# Alternativamente puedes usar DB_URL (en formato JDBC) o dejar que la app use DATABASE_URL (postres://...)
# Si solo tienes DATABASE_URL en formato postgresql://user:pass@host:5432/dbname, la clase DataSourceConfig
# incluida en el proyecto convertirá esa URL a JDBC al arrancar.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:}}

# Usuario y contrasena (se usan si no vienen embebidos en la URL)
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# Clase del controlador JDBC para Postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Puerto en el que se ejecutara el servidor (Render exporta $PORT)
server.port=${PORT:8080}

# Deshabilitar los trabajos por defecto de Spring Batch
spring.batch.job.enabled=false

# Prefijo para las plantillas Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/

# Sufijo para las plantillas Thymeleaf
spring.thymeleaf.suffix=.html

# Forzar codificación de Thymeleaf y desactivar cache en dev
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Ubicacion de los recursos estaticos (CSS, JS, imagenes, etc.)
spring.web.resources.static-locations=classpath:/static/

# Configuracion para almacenar sesiones en la base de datos
spring.session.store-type=jdbc

# Inicializar el esquema de la base de datos para las sesiones
spring.session.jdbc.initialize-schema=always

# Tiempo de expiracion de las sesiones (6 horas)
server.servlet.session.timeout=6h

# Forzar codificacion UTF-8 para los ficheros de mensajes (i18n)
spring.messages.encoding=UTF-8
