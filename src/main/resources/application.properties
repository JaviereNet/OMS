# Nombre de la aplicacion
spring.application.name=OMS

# Configuracion de Hibernate para actualizar automaticamente el esquema de la base de datos
spring.jpa.hibernate.ddl-auto=update

# URL de conexion a la base de datos MySQL
spring.datasource.url=${DB_URL}

# Usuario para la conexion a la base de datos
spring.datasource.username=${DB_USERNAME}

# Contrasena para la conexion a la base de datos
spring.datasource.password=${DB_PASSWORD}

# Puerto en el que se ejecutara el servidor
server.port=${PORT}

# Clase del controlador JDBC para MySQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Deshabilitar los trabajos por defecto de Spring Batch
spring.batch.job.enabled=false

# Prefijo para las plantillas Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/

# Sufijo para las plantillas Thymeleaf
spring.thymeleaf.suffix=.html

# Forzar codificación de Thymeleaf y desactivar cache en dev
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Ubicacion de los recursos estaticos (CSS, JS, imagenes, etc.)
spring.web.resources.static-locations=classpath:/static/

# Configuracion para almacenar sesiones en la base de datos
spring.session.store-type=jdbc

# Inicializar el esquema de la base de datos para las sesiones
spring.session.jdbc.initialize-schema=always

# Tiempo de expiracion de las sesiones (6 horas)
server.servlet.session.timeout=6h

# Forzar codificación UTF-8 para los ficheros de mensajes (i18n)
spring.messages.encoding=UTF-8

# Forzar codificación a nivel HTTP / web
spring.web.encoding.enabled=true
spring.web.encoding.charset=UTF-8
spring.web.encoding.force=true

# Compatibilidad/legacy (si el entorno lo usa)
spring.http.encoding.enabled=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.force=true

